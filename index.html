<style>
  /* ============================================================
     MieeL アプリ きょうつう（base.css）
     ============================================================ */
  :root {
    --mieel: radial-gradient(circle at 50% 0%,#1B8FE8 0%,#2BB8D6 28%,#3FCB9E 45%,#8FD24A 58%,#F4D027 72%,#F7941E 100%);
    --ink: #1F2937; --sub: #6B7280;

  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-weight: 700; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;

  }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }

  .topbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; min-height: 64px; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 4px 14px 4px 8px; border-radius: 999px; background: #fff; border: 3px solid var(--line); font-size: 19px; white-space: nowrap; }
  .chip .emo { font-size: 26px; }
  .chip.home { border-color: var(--line); color: var(--ink); position: relative; overflow: hidden; touch-action: none; }
  .chip.home i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(0,0,0,.12); }
  .chip.home.pressing i { width: 100%; transition: width 1.2s linear; }
  .chip.home span { position: relative; }
  .brand { flex: 1; display: flex; justify-content: center; align-items: center; gap: 14px; color: var(--sub); font-size: 16px; letter-spacing: .1em; min-width: 0; }
  .mieel-brand { display: flex; align-items: center; gap: 7px; white-space: nowrap; flex: none; }
  .orb-mini { width: 22px; height: 22px; border-radius: 50%; background: var(--mieel); flex: none; }
  .mieel-brand strong { font-size: 16px; color: var(--ink); }

  .mieel-foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid #E9ECEF; text-align: center; color: var(--sub); font-size: 13px; line-height: 1.8; }
  .mieel-foot .mieel-brand { justify-content: center; }
  .mieel-foot a { color: #1C7ED6; font-weight: 700; text-decoration: none; font-size: 14px; }
  .gear { position: relative; width: 52px; height: 52px; border-radius: 50%; border: none; background: transparent; opacity: .35; font-size: 26px; display: grid; place-items: center; }
  .gear::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 4px solid transparent; }
  .gear.pressing { opacity: 1; }
  .gear.pressing::after { border-color: var(--blue); animation: ring 1.5s linear forwards; }
  @keyframes ring { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 16px 12px; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; gap: clamp(8px, 1.4vh, 14px); animation: fadein .25s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
  @keyframes pulse { to { transform: scale(1.05); } }
  .shake { animation: shake .45s; }
  .title { font-size: clamp(24px, 3.4vw, 42px); text-align: center; margin: 0; line-height: 1.35; word-break: keep-all; overflow-wrap: anywhere; }
  .title small { display: block; font-size: .5em; color: var(--sub); }
  .actions { display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .big-btn { min-width: min(260px, 78vw); min-height: 76px; padding: 0 26px; border: none; border-radius: 999px; color: #fff; font-size: clamp(20px, 2.9vw, 32px); display: inline-flex; align-items: center; justify-content: center; gap: 10px; }
  .big-btn.go { background: var(--go); box-shadow: 0 8px 0 var(--go-d); }
  .big-btn.blue { background: var(--blue); box-shadow: 0 8px 0 var(--blue-d); }
  .big-btn.white { background: #fff; color: var(--ink); box-shadow: 0 8px 0 var(--line); border: 4px solid var(--line); }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .big-btn[disabled] { opacity: .35; pointer-events: none; }
  .mid-btn { min-height: 54px; padding: 0 18px; border-radius: 999px; border: 4px solid var(--line); background: #fff; font-size: clamp(15px, 1.9vw, 20px); box-shadow: 0 5px 0 var(--line); display: inline-flex; align-items: center; gap: 8px; }
  .mid-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .mid-btn.on { background: #FFF3BF; border-color: var(--gold); }
  .menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 44vw), 1fr)); gap: 14px; width: min(1000px, 100%); }
  .mcard { background: #fff; border: 6px solid var(--c); border-radius: 30px; padding: 14px 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; box-shadow: 0 7px 0 var(--c); position: relative; overflow: hidden; }
  .mcard .emo { font-size: clamp(46px, 7.5vh, 76px); }
  .mcard b { font-size: clamp(19px, 2.5vw, 28px); color: var(--c); }
  .mcard small { font-size: clamp(13px, 1.6vw, 17px); color: var(--sub); }
  .mcard:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--c); }
  .mcard .lp { position: absolute; left: 0; bottom: 0; height: 8px; width: 0; background: var(--c); }
  .mcard.pressing .lp { width: 100%; transition: width 1s linear; }
  .home { align-items: center; }
  .home > :first-child { margin-top: auto; } .home > :last-child { margin-bottom: auto; }
  .note-box { font-size: 14px; color: var(--sub); text-align: center; background: #fff; border-radius: 14px; padding: 8px 14px; border: 2px dashed var(--line); }
  .center { flex: 1 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(8px, 2vh, 18px); text-align: center; }
  .praise { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); font-size: clamp(50px, 8.6vw, 110px); font-weight: 900; color: var(--orange); white-space: nowrap; -webkit-text-stroke: 5px #fff; paint-order: stroke fill; pointer-events: none; z-index: 40; animation: praise 1.2s ease-out forwards; }
  @keyframes praise { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 0; } 22% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; } 70% { transform: translate(-50%, -54%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -70%); opacity: 0; } }
  .stars { font-size: clamp(56px, 11vh, 104px); letter-spacing: 8px; }
  .stars span { display: inline-block; animation: spinin .7s cubic-bezier(.2, 1.4, .4, 1) both; font-family: var(--emo); }
  .stars span.off { filter: grayscale(1); opacity: .25; }
  @keyframes spinin { from { transform: rotate(-360deg) scale(0); } to { transform: none; } }
  .pic { position: relative; display: grid; place-items: center; overflow: hidden; background: #fff; }
  .pic img { width: 100%; height: 100%; object-fit: cover; }
  .pic .emo { font-size: var(--es, 60px); }
  .quit { position: relative; overflow: hidden; border: 2px solid #DEE2E6; background: #fff; color: #868E96; font-size: 15px; padding: 9px 13px; border-radius: 999px; touch-action: none; }
  .quit i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #FFE3E3; }
  .quit span { position: relative; }
  .quit.pressing { color: #E03131; border-color: #FFA8A8; }
  .quit.pressing i { width: 100%; transition: width 1.5s linear; }
  .ov { position: fixed; inset: 0; z-index: 45; background: rgba(255, 255, 255, .97); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; animation: fadein .25s; text-align: center; overflow-y: auto; }

  body.calm *, body.calm *::before, body.calm *::after { animation: none !important; transition: none !important; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
  @media (max-width: 600px), (max-height: 520px) {
    .topbar { min-height: 50px; padding: 4px 8px; gap: 6px; }
    .topbar .appname, .topbar .url, .chip .lbl { display: none; }
    .chip { font-size: 15px; padding: 2px 8px 2px 6px; border-width: 2px; } .chip .emo { font-size: 20px; }
    .gear { width: 42px; height: 42px; font-size: 21px; }
    main { padding: 0 8px 8px; }
    .title { font-size: 21px; }
    .big-btn { min-width: 0; min-height: 56px; padding: 0 18px; font-size: 19px; box-shadow: 0 5px 0 var(--go-d); }
    .big-btn.blue { box-shadow: 0 5px 0 var(--blue-d); } .big-btn.white { box-shadow: 0 5px 0 var(--line); }
    .mid-btn { min-height: 44px; padding: 0 12px; font-size: 14px; }
    .menu { grid-template-columns: 1fr 1fr; gap: 10px; } .mcard { border-width: 4px; box-shadow: 0 5px 0 var(--c); border-radius: 22px; padding: 10px 6px; }
  }

  /* ---------- 先生用：設定 ---------- */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(17, 24, 39, .55); display: none; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; -webkit-user-select: text; user-select: text; }
  .modal.open { display: flex; }
  .panel { width: min(100%, 900px); background: #fff; border-radius: 24px; padding: 22px clamp(14px, 4vw, 32px) 28px; font-weight: 400; font-size: 17px; box-shadow: 0 20px 60px rgba(0,0,0,.3); }
  .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .panel h2 { margin: 0; font-size: 25px; font-weight: 700; }
  .panel h3 { margin: 28px 0 10px; font-size: 20px; font-weight: 700; padding-left: 10px; border-left: 6px solid var(--accent, var(--blue)); }
  .panel h4 { margin: 14px 0 4px; }
  .note { color: var(--sub); font-size: 15px; line-height: 1.6; margin: 6px 0; }
  .panel label.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 0; border-bottom: 1px solid #F1F3F5; }
  .panel label.row > span:first-child { flex: 1; }
  .panel input[type=text], .panel select, .panel textarea { font: inherit; font-size: 17px; padding: 9px 12px; border: 2px solid #CED4DA; border-radius: 12px; background: #fff; }
  .panel textarea { width: 100%; min-height: 110px; line-height: 1.6; }
  .panel input[type=checkbox] { width: 28px; height: 28px; accent-color: var(--go); }
  .panel input[type=range] { width: 200px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; border: none; border-radius: 12px; padding: 11px 18px; font-size: 16px; font-weight: 700; background: #E9ECEF; color: var(--ink); cursor: pointer; }
  .btn.primary { background: var(--blue); color: #fff; } .btn.ok { background: var(--go); color: #fff; } .btn.warn { background: #FFF0F0; color: #C92A2A; }
  .seg { display: flex; gap: 6px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 86px; padding: 10px 8px; font-size: 15px; font-weight: 700; border-radius: 12px; border: 2px solid #CED4DA; background: #fff; }
  .seg button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .srow { display: grid; grid-template-columns: minmax(150px, 220px) 1fr; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid #F1F3F5; }
  @media (max-width: 600px) { .srow { grid-template-columns: 1fr; } }
  .prow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid #E9ECEF; border-radius: 14px; flex-wrap: wrap; margin-bottom: 6px; }
  .mini-btn { min-width: 40px; height: 40px; border-radius: 10px; border: none; background: #F1F3F5; font-size: 16px; padding: 0 10px; }
  .mini-btn.warn { background: #FFF0F0; color: #C92A2A; }
  .rec-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rec-table th, .rec-table td { border-bottom: 1px solid #E9ECEF; padding: 6px 4px; text-align: left; vertical-align: top; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: rgba(17,24,39,.9); color: #fff; padding: 14px 22px; border-radius: 14px; font-size: 18px; z-index: 60; display: none; max-width: 90vw; text-align: center; }
  .toast.show { display: block; }
  .lib { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
  .lib button { background: #fff; border: 3px solid var(--line); border-radius: 16px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 14px; }
  .lib button .emo { font-size: 38px; }
  .lib h4 { grid-column: 1 / -1; margin: 6px 0 0; color: var(--sub); }

  /* ---------- プリント（A4） ---------- */
  #printRoot { display: none; }
  .ppage { flex: none; width: 210mm; height: 297mm; padding: 12mm 13mm 10mm; box-sizing: border-box; background: #fff; color: #111; position: relative; overflow: hidden; font-family: "BIZ UDPGothic", "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; font-weight: 700; display: flex; flex-direction: column; gap: 3mm; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .ppage .phd { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: .8mm solid #111; padding-bottom: 2mm; gap: 4mm; }
  .ppage .phd h1 { margin: 0; font-size: 7.5mm; }
  .ppage .phd small { font-size: 3.8mm; font-weight: 400; display: block; }
  .ppage .nm { font-size: 5mm; border-bottom: .4mm solid #111; min-width: 50mm; padding: 0 2mm 1mm; white-space: nowrap; }
  .ppage .pf { margin-top: auto; text-align: right; font-size: 3mm; color: #888; }
  .ppage .pe { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-weight: 400; }
  @media print {
    @page { size: A4 portrait; margin: 0; }
    html, body { height: auto !important; overflow: visible !important; display: block !important; background: #fff !important; padding: 0 !important; }
    body > *:not(#printRoot) { display: none !important; }
    #printRoot { display: block !important; }
    #printRoot .ppage { page-break-after: always; break-after: page; }
    #printRoot .ppage:last-child { page-break-after: auto; break-after: auto; }
  }

  /* ---------- 🖨️ プリントの 画面 ---------- */
  .panel.wide { width: min(100%, 1180px); }
  .seglabel { margin: 12px 0 6px; font-weight: 700; font-size: 15px; }
  .prgrid { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 18px; margin-top: 10px; }
  .prctl .seg button { min-width: 0; }
  .prctl .seg.types { flex-direction: column; }
  .prctl .seg.types button { text-align: left; padding: 10px 14px; }
  .btn.blue { background: #1C7ED6; color: #fff; }
  .prprev { background: #E9ECEF; border-radius: 16px; padding: 12px; max-height: 76vh; overflow-y: auto; }
  .pwrap { margin: 0 auto 14px; box-shadow: 0 4px 14px rgba(0,0,0,.18); overflow: hidden; background: #fff; }
  .pwrap .ppage { transform-origin: top left; }
  @media (max-width: 820px) { .prgrid { grid-template-columns: 1fr; } }

  /* ============================================================
     からだ つたえる
     ============================================================ */
  :root { --bg: #F0FAF6; --line: #CDEBDF; --accent: #0CA678; }
  .brand { color: #5FA88C; }
  .step { gap: 8px; }
  .shead { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  .shead .ask { flex: 1; text-align: center; font-size: clamp(22px, 3.2vw, 36px); font-weight: 700; }
  .back { min-width: 90px; }
  .sdots { display: flex; gap: 6px; justify-content: center; }
  .sdots i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); } .sdots i.on { background: var(--accent); }

  /* からだ マップ */
  .mapwrap { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, 34%); gap: 14px; }
  .bodies { display: flex; gap: 10px; justify-content: center; min-height: 0; }
  .bodies .bd { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; min-height: 0; }
  .bodies .bd b { font-size: 15px; color: var(--sub); }
  .bodies svg { width: 100%; height: 100%; max-height: 66vh; flex: 1; min-height: 0; }
  svg .pt { fill: #FFE3C8; stroke: #D9A47A; stroke-width: 2.5; cursor: pointer; transition: fill .15s; }
  svg .pt.f { fill: #FFD3B0; }
  svg .pt.f2 { fill: rgba(255, 211, 176, .25); stroke: #EBC3A3; stroke-dasharray: 3 3; stroke-width: 1.5; }
  .pmap .pt.f2 { fill: #fff; stroke: #bbb; }
  svg .pt:hover { fill: #FFC9A0; }
  svg .pt.on { fill: #FF6B6B; stroke: #C92A2A; animation: throb 1s ease-in-out infinite; }
  @keyframes throb { 50% { fill: #FFA8A8; } }
  .plist { display: flex; flex-wrap: wrap; gap: 6px; align-content: flex-start; overflow-y: auto; }
  .plist button { border: 3px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: clamp(15px, 1.8vw, 19px); }
  .plist button.on { background: #FF6B6B; border-color: #C92A2A; color: #fff; }

  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 42vw), 1fr)); gap: 12px; width: min(1000px, 100%); margin: auto; }
  .opts button { background: #fff; border: 5px solid var(--line); border-radius: 24px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: clamp(18px, 2.4vw, 26px); box-shadow: 0 6px 0 var(--line); }
  .opts button .emo { font-size: clamp(46px, 8vh, 76px); }
  .opts button small { font-size: 13px; color: var(--sub); }
  .opts button:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--line); }
  .scale { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; width: min(1100px, 100%); margin: auto; }
  .scale button { border: 5px solid var(--sc); background: #fff; border-radius: 22px; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: clamp(13px, 1.7vw, 18px); box-shadow: 0 6px 0 var(--sc); }
  .scale button .emo { font-size: clamp(44px, 8vw, 84px); }
  .scale button b { font-size: clamp(22px, 3vw, 34px); color: var(--sc); }
  .scale button:active { transform: translateY(4px); }
  .scalebar { height: 14px; border-radius: 99px; background: linear-gradient(90deg, #40C057, #FAB005, #FA5252); width: min(1100px, 100%); margin: 0 auto; }

  /* つたえる カード */
  .tell { flex: 1; display: flex; align-items: center; justify-content: center; }
  .tcard { background: #fff; border: 8px solid var(--accent); border-radius: 40px; padding: clamp(14px, 3vw, 36px); display: grid; grid-template-columns: auto minmax(0, 1fr); gap: clamp(12px, 3vw, 36px); align-items: center; width: min(1000px, 100%); }
  .tcard svg { width: clamp(110px, 20vw, 220px); height: auto; }
  .tcard .msg { font-size: clamp(28px, 4.6vw, 58px); font-weight: 800; line-height: 1.45; }
  .tcard .meta { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: clamp(16px, 2vw, 22px); }
  .tcard .meta span { background: #F1F3F5; border-radius: 999px; padding: 4px 12px; }

  /* カード */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(150px, 30vw), 1fr)); gap: 10px; width: 100%; }
  .cards button { background: #fff; border: 4px solid var(--cc, var(--line)); border-radius: 22px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: clamp(15px, 1.9vw, 20px); line-height: 1.3; }
  .cards button .pic { width: 70%; aspect-ratio: 1; border-radius: 14px; --es: clamp(44px, 7vh, 66px); background: transparent; }
